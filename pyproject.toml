[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efficient-ai"
version = "0.1.0"
description = "Efficient AI: an open-source personal AI assistant for Windows - Sidekick, Double Tap, voice, nightly knowledge, proactive cards."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["efficient*"]

[project.scripts]
efficient = "efficient.__main__:_entry"
